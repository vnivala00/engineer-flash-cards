<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamified Flashcard Learning - Turku AMK</title>
    <style>
        :root {
            --turku-yellow: #FFD400;
            --bg-color: #0f172a;
            --text-color: #f1f5f9;
            --muted-text: #cbd5e1;
            --border-color: #334155;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-image: url('tausta.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            position: relative;
        }

        header {
            margin: 3.5rem 0 1.5rem 0;
            text-align: center;
        }

        h1 {
            font-size: 2.8rem;
            color: var(--turku-yellow);
            margin: 0;
            letter-spacing: -0.5px;
            font-weight: 800;
            text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        }

        .subtitle-hint {
            color: var(--muted-text);
            font-size: 1rem;
            margin-top: 0.5rem;
            letter-spacing: 0.5px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.6);
        }

        .container {
            width: 90%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-grow: 1;
            padding-bottom: 2rem;
        }

        /* Etusivun kuvalliset pakka-kortit */
        #home-view {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 2rem;
            width: 100%;
            margin-top: 2rem;
        }

        .deck-card {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            cursor: pointer;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            border-top: 8px solid var(--turku-yellow);
            border-left: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            min-height: 220px;
            background-size: cover;
            background-position: center;
        }

        .deck-card.visual {
            background-image: linear-gradient(to bottom, rgba(15, 23, 42, 0.2), rgba(15, 23, 42, 0.95)), url('VISUAL-etu.png');
        }

        .deck-card.tactile {
            background-image: linear-gradient(to bottom, rgba(15, 23, 42, 0.2), rgba(15, 23, 42, 0.95)), url('TACTILE-etu.png');
        }

        .deck-card.auditory {
            background-image: linear-gradient(to bottom, rgba(15, 23, 42, 0.2), rgba(15, 23, 42, 0.95)), url('AUDITORY-etu.png');
        }

        .deck-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(255, 212, 0, 0.25);
        }

        .deck-card-content {
            padding: 1.8rem 1.5rem;
            width: 100%;
            box-sizing: border-box;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(4px);
        }

        .deck-card h3 {
            margin: 0 0 0.3rem 0;
            font-size: 1.8rem;
            color: var(--text-color);
            font-weight: 700;
        }

        .deck-card p {
            color: var(--muted-text);
            font-size: 0.95rem;
            margin: 0;
        }

        /* Korttinäkymä */
        #card-view {
            display: none;
            width: 100%;
            flex-direction: column;
            align-items: center;
        }

        .nav-bar {
            width: 100%;
            display: flex;
            align-items: center;
            margin-bottom: 1.5rem;
            max-width: 550px;
        }

        .back-btn {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(6px);
            border: 1px solid var(--border-color);
            font-size: 1rem;
            cursor: pointer;
            color: var(--turku-yellow);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .back-btn:hover {
            background: rgba(51, 65, 85, 0.9);
            border-color: var(--turku-yellow);
        }

        .flashcard {
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(8px);
            width: 100%;
            max-width: 550px;
            height: 400px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            box-sizing: border-box;
            text-align: center;
            position: relative;
            user-select: none;
            border: 1px solid var(--border-color);
        }

        .card-content {
            font-size: 1.2rem;
            line-height: 1.5;
            color: var(--text-color);
            max-height: 320px;
            overflow-y: auto;
            width: 100%;
        }

        .controls {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .btn {
            background-color: var(--turku-yellow);
            color: #0f172a;
            border: none;
            padding: 0.75rem 1.8rem;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .btn:hover {
            background-color: #e6bf00;
            transform: translateY(-2px);
        }

        .progress {
            margin-top: 1.2rem;
            font-weight: 600;
            color: var(--text-color);
            background: rgba(15, 23, 42, 0.6);
            padding: 0.2rem 0.8rem;
            border-radius: 12px;
            font-size: 1.1rem;
        }

        .card-img {
            max-width: 160px;
            max-height: 120px;
            margin-bottom: 0.5rem;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            object-fit: cover;
        }
    </style>
</head>
<body>

    <header>
        <h1>Gamified flashcard learning</h1>
        <div class="subtitle-hint">Interactive Math, Engineering & Sensory Practice</div>
    </header>

    <div class="container">
        <!-- Etusivu: 3 pakkaa kuvataustoilla -->
        <div id="home-view">
            <div class="deck-card visual" onclick="openDeck('visual')">
                <div class="deck-card-content">
                    <h3>Visual</h3>
                    <p>50 Engineering Flashcards</p>
                </div>
            </div>
            <div class="deck-card tactile" onclick="openDeck('tactile')">
                <div class="deck-card-content">
                    <h3>Tactile</h3>
                    <p>50 Kinesthetic Tasks</p>
                </div>
            </div>
            <div class="deck-card auditory" onclick="openDeck('auditory')">
                <div class="deck-card-content">
                    <h3>Auditory</h3>
                    <p>50 Auditory Learning Tasks</p>
                </div>
            </div>
        </div>

        <!-- Korttinäkymä -->
        <div id="card-view">
            <div class="nav-bar">
                <button class="back-btn" onclick="goHome()">&#8592; Back to Decks</button>
            </div>
            
            <div class="flashcard">
                <div class="card-content" id="card-content"></div>
            </div>

            <div class="progress" id="progress-text">Card 1 of 50</div>

            <div class="controls">
                <button class="btn" onclick="prevCard()">Previous</button>
                <button class="btn" onclick="nextCard()">Next</button>
            </div>
        </div>
    </div>

    <script>

                { front: '<img src="5.jpg" class="card-img" onerror="this.outerHTML=\'<p style=\\\'color: #FFD400; font-size: 0.9rem;\\\'>[Kuva 5.jpg puuttuu kansiosta]</p>\'"><br>What workshop part is this?', back: 'Lathe chuck<br><span style="font-size:0.9rem; color:#94a3b8;">Card 05/50</span>' },
                { front: '<img src="6.jpg" class="card-img" onerror="this.outerHTML=\'<p style=\\\'color: #FFD400; font-size: 0.9rem;\\\'>[Kuva 6.jpg puuttuu kansiosta]</p>\'"><br>What automation device is this?', back: 'Industrial robot<br><span style="font-size:0.9rem; color:#94a3b8;">Card 06/50</span>' },
                { front: '<img src="7.jpg" class="card-img" onerror="this.outerHTML=\'<p style=\\\'color: #FFD400; font-size: 0.9rem;\\\'>[Kuva 7.jpg puuttuu kansiosta]</p>\'"><br>What hydraulic component is this?', back: 'Hydraulic cylinder<br><span style="font-size:0.9rem; color:#94a3b8;">Card 07/50</span>' },

            ],
            tactile: [
                { front: 'Walk and recall:<br><br><em>"Walk around the room while reciting everything you remember about a topic without looking at your notes."</em>', back: '<strong>Goal achieved!</strong><br><span style="font-size:1rem; color:#94a3b8;">Movement increases blood flow and cognitive retention.</span>' },
                { front: 'Teach while walking:<br><br><em>"Explain a difficult concept as if you were teaching someone, while walking around."</em>', back: '<strong>Goal achieved!</strong><br><span style="font-size:1rem; color:#94a3b8;">Combines kinetic activity with verbal processing.</span>' },
                { front: 'Study stations:<br><br><em>"Divide your subject into four topics and create a different physical study station for each one."</em>', back: '<strong>Goal achieved!</strong><br><span style="font-size:1rem; color:#94a3b8;">Changes in physical environment prevent mental fatigue.</span>' },
                { front: 'Step-by-step learning:<br><br><em>"Take one step forward every time you correctly recall a new fact."</em>', back: '<strong>Goal achieved!</strong><br><span style="font-size:1rem; color:#94a3b8;">Creates a physical tracking system for mental progress.</span>' },
                { front: 'Movement breaks:<br><br><em>"After studying for 20 minutes, create a 2-minute movement routine before returning to your work."</em>', back: '<strong>Goal achieved!</strong><br><span style="font-size:1rem; color:#94a3b8;">Resets focus and keeps energy levels high.</span>' },
                { front: 'Act it out:<br><br><em>"Physically act out a process, historical event, scientific concept, or theory."</em>', back: '<strong>Goal achieved!</strong><br><span style="font-size:1rem; color:#94a3b8;">Engages muscle memory to solidify complex ideas.</span>' },
                { front: 'Concept corners:<br><br><em>"Assign different corners of the room to different answers. Move to the corner representing your answer."</em>', back: '<strong>Goal achieved!</strong><br><span style="font-size:1rem; color:#94a3b8;">Spatial learning anchors concepts in physical locations.</span>' },
                { front: 'Memory walk:<br><br><em>"Place notes around your room and walk between them, recalling the information at each location."</em>', back: '<strong>Goal achieved!</strong><br><span style="font-size:1rem; color:#94a3b8;">Uses the method of loci (memory palace) with physical movement.</span>' },
                { front: 'Squat and solve:<br><br><em>"Complete one squat after solving each practice question correctly."</em>', back: '<strong>Goal achieved!</strong><br><span style="font-size:1rem; color:#94a3b8;">Rewards mental effort with physical energy release.</span>' },
                { front: 'Create a human timeline:<br><br><em>"Arrange yourself and your classmates in chronological order to represent events or stages in a process."</em>', back: '<strong>Goal achieved!</strong><br><span style="font-size:1rem; color:#94a3b8;">Visualizes chronological order through physical positioning.</span>' },
                { front: 'Build your knowledge:<br><br><em>"Use LEGO, blocks, clay, or everyday objects to physically represent a concept you\'re studying."</em>', back: '<strong>Goal achieved!</strong><br><span style="font-size:1rem; color:#94a3b8;">Translates abstract concepts into tangible 3D objects.</span>' },
                { front: 'Make a 3D model:<br><br><em>"Create a physical model of something you\'ve learned, such as a cell, machine, molecule, or building."</em>', back: '<strong>Goal achieved!</strong><br><span style="font-size:1rem; color:#94a3b8;">Deepens structural understanding through hands-on construction.</span>' },
                { front: 'Paper engineering:<br><br><em>"Fold, cut, and assemble paper to create a visual representation of a difficult topic."</em>', back: '<strong>Goal achieved!</strong><br><span style="font-size:1rem; color:#94a3b8;">Enhances spatial reasoning and fine motor skills.</span>' },
                { front: 'Concept puzzle:<br><br><em>"Turn your notes into puzzle pieces and challenge yourself to put the information back together."</em>', back: '<strong>Goal achieved!</strong><br><span style="font-size:1rem; color:#94a3b8;">Promotes active reconstruction of fragmented knowledge.</span>' },
                { front: 'Create flashcards:<br><br><em>"Handwrite and decorate flashcards using different colours, textures, and symbols."</em>', back: '<strong>Goal achieved!</strong><br><span style="font-size:1rem; color:#94a3b8;">The act of writing physically encodes data into memory.</span>' },
                { front: 'Build a mind map:<br><br><em>"Use sticky notes to physically arrange ideas and connect related concepts."</em>', back: '<strong>Goal achieved!</strong><br><span style="font-size:1rem; color:#94a3b8;">Allows flexible spatial organization of thoughts.</span>' },
                { front: 'Make a study sculpture:<br><br><em>"Use household objects to represent an abstract concept."</em>', back: '<strong>Goal achieved!</strong><br><span style="font-size:1rem; color:#94a3b8;">Stimulates creative thinking and metaphorical representation.</span>' },
                { front: 'Construct a flowchart:<br><br><em>"Use string, paper, and sticky notes to create a physical flowchart of a process."</em>', back: '<strong>Goal achieved!</strong><br><span style="font-size:1rem; color:#94a3b8;">Clarifies sequential steps and dependencies physically.</span>' },
                { front: 'Design a board game:<br><br><em>"Turn your subject into a board game with questions, challenges, and rewards."</em>', back: '<strong>Goal achieved!</strong><br><span style="font-size:1rem; color:#94a3b8;">Gamifies learning and structures information into rules.</span>' },
                { front: 'Create a miniature classroom:<br><br><em>"Use small objects or figurines to demonstrate a concept you are struggling to understand."</em>', back: '<strong>Goal achieved!</strong><br><span style="font-size:1rem; color:#94a3b8;">Simplifies complex setups into manageable scale models.</span>' },
                { front: 'Rewrite from memory:<br><br><em>"Read a section of your notes, put them away, and rewrite everything you remember by hand."</em>', back: '<strong>Goal achieved!</strong><br><span style="font-size:1rem; color:#94a3b8;">Forces active recall and manual encoding.</span>' },
                { front: 'Sticky-note challenge:<br><br><em>"Write one important fact on each sticky note and organise them into categories."</em>', back: '<strong>Goal achieved!</strong><br><span style="font-size:1rem; color:#94a3b8;">Makes sorting and categorizing physical and modular.</span>' },
                { front: 'Colour-code your learning:<br><br><em>"Assign different colours to definitions, examples, formulas, and important concepts."</em>', back: '<strong>Goal achieved!</strong><br><span style="font-size:1rem; color:#94a3b8;">Improves visual and tactile categorization.</span>' },
                { front: 'Trace to remember:<br><br><em>"Write important formulas or vocabulary repeatedly using your finger before writing them on paper."</em>', back: '<strong>Goal achieved!</strong><br><span style="font-size:1rem; color:#94a3b8;">Builds muscle memory for key shapes and letters.</span>' },
                { front: 'Cut and sort:<br><br><em>"Write key terms and definitions on separate pieces of paper, cut them out, and match them."</em>', back: '<strong>Goal achieved!</strong><br><span style="font-size:1rem; color:#94a3b8;">Creates physical interactive matching sets.</span>' },
                { front: 'Create a tactile vocabulary list:<br><br><em>"Use different textures or materials to represent different words or concepts."</em>', back: '<strong>Goal achieved!</strong><br><span style="font-size:1rem; color:#94a3b8;">Engages touch receptors for stronger memory anchors.</span>' },
                { front: 'Draw instead of writing:<br><br><em>"Replace a paragraph of notes with a detailed illustration."</em>', back: '<strong>Goal achieved!</strong><br><span style="font-size:1rem; color:#94a3b8;">Translates text into visual-spatial memory.</span>' },
                { front: 'Formula cards:<br><br><em>"Write formulas on separate cards and physically arrange them according to how they relate to each other."</em>', back: '<strong>Goal achieved!</strong><br><span style="font-size:1rem; color:#94a3b8;">Reveals relationships and hierarchies through physical layout.</span>' },
                { front: 'The disappearing notes challenge:<br><br><em>"Gradually cover parts of your notes with paper until you can recall the entire page without looking."</em>', back: '<strong>Goal achieved!</strong><br><span style="font-size:1rem; color:#94a3b8;">Fades scaffolding progressively to test true retention.</span>' },
                { front: 'Study Jenga:<br><br><em>"Write questions on Jenga blocks. Answer a question every time you pull one out."</em>', back: '<strong>Goal achieved!</strong><br><span style="font-size:1rem; color:#94a3b8;">Combines tactile dexterity with cognitive testing under tension.</span>' },
                { front: 'Flashcard toss:<br><br><em>"Place containers at different distances, each representing a difficulty level. Throw a ball into a container and answer a question of that difficulty."</em>', back: '<strong>Goal achieved!</strong><br><span style="font-size:1rem; color:#94a3b8;">Adds hand-eye coordination and spatial targets to studying.</span>' },
                { front: 'Memory matching:<br><br><em>"Create matching cards with questions and answers and find the correct pairs."</em>', back: '<strong>Goal achieved!</strong><br><span style="font-size:1rem; color:#94a3b8;">Provides tactile feedback through card manipulation.</span>' },
                { front: 'Timed sorting:<br><br><em>"Sort concepts, definitions, or examples into the correct categories against the clock."</em>', back: '<strong>Goal achieved!</strong><br><span style="font-size:1rem; color:#94a3b8;">Increases focus and physical speed of sorting.</span>' },
                { front: 'Dice challenge:<br><br><em>"Roll a dice to determine your next study activity (e.g. summarise, draw, explain, solve, recall, or teach)."</em>', back: '<strong>Goal achieved!</strong><br><span style="font-size:1rem; color:#94a3b8;">Introduces random variety and physical interaction with dice.</span>' },
                { front: 'Puzzle yourself:<br><br><em>"Solve a puzzle where each correctly answered question reveals another piece."</em>', back: '<strong>Goal achieved!</strong><br><span style="font-size:1rem; color:#94a3b8;">Rewards intellectual progress with puzzle completion.</span>' },
                { front: 'Question ball:<br><br><em>"Throw a ball to a classmate, who must answer a question about the topic before passing it on."</em>', back: '<strong>Goal achieved!</strong><br><span style="font-size:1rem; color:#94a3b8;">Combines physical catch with group accountability.</span>' },
                { front: 'Beat your previous score:<br><br><em>"Complete a set of practice questions and physically record your progress each time."</em>', back: '<strong>Goal achieved!</strong><br><span style="font-size:1rem; color:#94a3b8;">Tracks growth visually and manually.</span>' },
                { front: 'The 5-minute challenge:<br><br><em>"Set a timer and see how many concepts you can recall by writing or drawing them within five minutes."</em>', back: '<strong>Goal achieved!</strong><br><span style="font-size:1rem; color:#94a3b8;">Improves retrieval speed under timed pressure.</span>' },
                { front: 'Teach a teddy bear:<br><br><em>"Explain your topic to a stuffed animal or figurine as if it were a student."</em>', back: '<strong>Goal achieved!</strong><br><span style="font-size:1rem; color:#94a3b8;">Creates a safe, tactile listener to practice articulation.</span>' },
                { front: 'Become the concept:<br><br><em>"Imagine you are a molecule, historical figure, machine component, or mathematical function and act out its role."</em>', back: '<strong>Goal achieved!</strong><br><span style="font-size:1rem; color:#94a3b8;">Embodied cognition helps internalize complex behaviors.</span>' },
                { front: 'Create a study dance:<br><br><em>"Make simple movements to represent different stages of a process or sequence."</em>', back: '<strong>Goal achieved!</strong><br><span style="font-size:1rem; color:#94a3b8;">Rhythm and choreography lock sequential steps into memory.</span>' },
                { front: 'Study outdoors:<br><br><em>"Take your notes outside and combine studying with a walk in a suitable environment."</em>', back: '<strong>Goal achieved!</strong><br><span style="font-size:1rem; color:#94a3b8;">Combines fresh air, change of scenery, and light movement.</span>' },
                { front: 'Make a physical study timeline:<br><br><em>"Use string and clips to organise important dates, events, or stages."</em>', back: '<strong>Goal achieved!</strong><br><span style="font-size:1rem; color:#94a3b8;">Linear physical layout makes historical or process flow clear.</span>' },
                { front: 'Experiment and discover:<br><br><em>"Create a small experiment to demonstrate something you have learned."</em>', back: '<strong>Goal achieved!</strong><br><span style="font-size:1rem; color:#94a3b8;">Empirical proof anchors theoretical understanding.</span>' },
                { front: 'Build your own revision kit:<br><br><em>"Collect objects, cards, models, and materials that help you physically interact with your subject."</em>', back: '<strong>Goal achieved!</strong><br><span style="font-size:1rem; color:#94a3b8;">Personalizes tactile tools for specific study modules.</span>' },
                { front: 'Study with your senses:<br><br><em>"Find ways to incorporate touch, movement, sight, and sound into one study session."</em>', back: '<strong>Goal achieved!</strong><br><span style="font-size:1rem; color:#94a3b8;">Multisensory integration maximizes memory pathways.</span>' },
                { front: 'Create a reward system:<br><br><em>"Put small rewards in envelopes and open one after completing a specific study goal."</em>', back: '<strong>Goal achieved!</strong><br><span style="font-size:1rem; color:#94a3b8;">Uses physical anticipation and surprise to reinforce habits.</span>' },
                { front: 'The ultimate teach-back:<br><br><em>"Pick a topic, build a physical demonstration, and explain it to someone without referring to your notes."</em>', back: '<strong>Goal achieved!</strong><br><span style="font-size:1rem; color:#94a3b8;">Ultimate test of mastery combining building and communication.</span>' },
                { front: 'Kinesthetic anchor:<br><br><em>"Associate a specific hand gesture with a key concept whenever you review it."</em>', back: '<strong>Goal achieved!</strong><br><span style="font-size:1rem; color:#94a3b8;">Triggers memory recall instantly through physical movement.</span>' },
                { front: 'Rhythmic pacing:<br><br><em>"Pace back and forth to a steady rhythm while reciting complex formulas or definitions."</em>', back: '<strong>Goal achieved!</strong><br><span style="font-size:1rem; color:#94a3b8;">Keeps alertness high and improves information flow.</span>' }
            ],
            auditory: [
                "1. Make a mind map",
                "2. Turn book into audiobook",
                "3. Find podcasts of the topic or book",
                "4. Find music related to the topic or book",
                "5. Listen to a lector related to the topic or book",
                "6. Discuss with your pair about the topic or book",
                "7. Explain the topic out loud as if you were teaching it to a younger student",
                "8. Record yourself summarizing the main ideas, then play it back and note what you missed",
                "9. Read your notes aloud, using different voices or emphasis for key points",
                "10. Pretend to be a radio host or news reporter and present the topic to an imaginary audience",
                "11. Talk through a problem step by step out loud while you solve it",
                "12. Record a short audio summary of each chapter or section and listen to the recordings before bed or on your way to school",
                "13. Use a text-to-speech tool to have your notes read back to you",
                "14. Listen to a recording of a class or lecture a second time and pause it to repeat key ideas in your own words",
                "15. Create a voice memo “cheat sheet” of the ten most important facts",
                "16. Turn key facts into a rhyme, rap, or a song",
                "17. Make up a catchy chant or rhythm to remember lists, dates, or formulas",
                "18. Create an acronym or mnemonic and say it aloud several times",
                "19. Repeat new vocabulary aloud, stressing how each word sounds",
                "20. Hold a debate where each side argues a different view of the topic",
                "21. Quiz each other out loud, taking turns as the question-asker",
                "22. Form a small study group and have each person present one part of the topic",
                "23. Interview a classmate, family member, or expert about the topic",
                "24. Play “20 Questions” with concepts from the topic",
                "25. Retell the topic as a story to someone and ask them to repeat it back to you",
                "26. Act out a scene from the book or historical event, focusing on the dialogue",
                "27. Record a mock podcast episode with a partner, covering the topic as hosts",
                "28. Present the topic as a short speech or TED talk",
                "29. Record yourself saying a term, leave a pause, then say the definition. Play it back and try to answer in the pause",
                "30. Call a friend or relative and explain what you learned in three minutes. Let them interrupt with questions",
                "31. In a group, go around the circle with each person adding one fact. No repeats allowed, and anyone who gets stuck is out",
                "32. Choose a sound for each type of idea, such as a clap for causes, a snap for effects, and a tap for examples. Say your notes out loud and make the matching sound for each point",
                "33. During a lecture or video, notice which words the speaker stresses or repeats. Write them down afterward, since they are often the key points",
                "34. Recite what you know while walking around the room and link each fact to a step or spot in the room. Revisit the same spots to recall the facts",
                "35. A partner reads one sentence of your notes aloud, and you immediately repeat it back word for word. Then switch roles",
                "36. Explain the topic to an object, such as a toy, a plant, or a pet. If you get stuck you’ve found something you need to review",
                "37. Play a video clip on the topic with the sound off and narrate it yourself. Then replay it with the sound on and compare what you said",
                "38. While listening to a podcast or lecture, pause it and say aloud what you think comes next. Press play and check how close you were",
                "39. One person describes a key term without saying the word, and the other person guesses it. Only spoken clues are allowed",
                "40. Whisper a key fact down a line of classmates. The last person says what they heard, and you compare it with the original to see what got lost",
                "41. Take turns playing the game-show host who reads out questions in a dramatic voice while the others race to answer",
                "42. Choose a steady beat, such as tapping a pencil or using a metronome app, and recite your facts in time with it until the rhythm carries you through the list",
                "43. Read something you write slowly out loud. Your ears will catch mistakes and awkward sentences that your eyes skipped",
                "44. At the end of each study session, record 60 seconds on what you learned today and what is still confusing. Listen to the entries before the test",
                "45. Send a classmate a voice message with a question about the topic. They reply with a voice answer and a question of their own",
                "46. Listen to two different audio sources on the same topic, such as two podcasts or two speakers. Discuss what they agree on and where they differ",
                "47. Explain the topic in two minutes, then in 30 seconds, then in a single sentence. Each round forces you to pick out what matters most",
                "48. Break long or tricky terms into syllables and clap each one while saying it out loud. Repeat until you can say the word smoothly from memory",
                "49. Listen to a lecture or audio recording at faster speed first to get the big picture. Then listen at normal speed and pause to note the details",
                "50. Recite the steps of a process or the events of a story in reverse order, from the end to the start. This shows whether you really understand how the parts connect"
            ]
        };

        let currentDeckKey = '';
        let currentIndex = 0;
        let isFlipped = false;

        function openDeck(deckKey) {
            currentDeckKey = deckKey;
            currentIndex = 0;
            isFlipped = false;
            
            document.getElementById('home-view').style.display = 'none';
            document.getElementById('card-view').style.display = 'flex';
            
            updateCard();
        }

        function goHome() {
            document.getElementById('card-view').style.display = 'none';
            document.getElementById('home-view').style.display = 'grid';
        }

        function updateCard() {
            const card = decks[currentDeckKey][currentIndex];
            const contentDiv = document.getElementById('card-content');
            
            if (currentDeckKey === 'auditory') {
                contentDiv.innerHTML = `<div style="font-size: 1.3rem; font-weight: 600; color: var(--turku-yellow);">${card}</div>`;
            } else {
                if (!isFlipped) {
                    contentDiv.innerHTML = card.front;
                } else {
                    contentDiv.innerHTML = `<div style="color: var(--turku-yellow); font-weight: bold; margin-bottom: 0.5rem;">Answer / Explanation:</div>${card.back}`;
                }
            }

            document.getElementById('progress-text').innerText = `Card ${currentIndex + 1} of ${decks[currentDeckKey].length}`;
        }

        function flipCard() {
            if (currentDeckKey === 'auditory') return;
            isFlipped = !isFlipped;
            updateCard();
        }

        document.querySelector('.flashcard').addEventListener('click', function() {
            if (currentDeckKey !== 'auditory') {
                flipCard();
            }
        });

        function nextCard() {
            isFlipped = false;
            currentIndex = (currentIndex + 1) % decks[currentDeckKey].length;
            updateCard();
        }

        function prevCard() {
            isFlipped = false;
            currentIndex = (currentIndex - 1 + decks[currentDeckKey].length) % decks[currentDeckKey].length;
            updateCard();
        }
    </script>
</body>
</html>
